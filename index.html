<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FM Photo Studio - Customer Service</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <div class="header-logo">📸</div>
    <div class="header-text">
      <h1>FM Photo Studio</h1>
      <p>Mfumo wa Customer Service</p>
    </div>
  </header>

  <div class="wrap">

    <!-- REGISTER EVENT -->
    <div class="card">
      <h3>Register New Event</h3>

      <label>Tarehe</label>
      <input type="date" id="eventDate" />

      <input type="text" id="eventName" placeholder="Jina la event" />
      <input type="text" id="eventLocation" placeholder="Location" />

      <button id="addEventBtn">Save Event!</button>
    </div>

    <!-- REGISTER CUSTOMER -->
    <div class="card">
      <h3>Register New Customer</h3>

      <label>Event</label>
      <select id="eventSelect"></select>

      <label>Tarehe</label>
      <input type="date" id="date" />

      <input type="text" id="name" placeholder="Jina la mteja" />
      <input type="tel" id="phone" placeholder="Namba ya simu" />

      <label>Aina ya picha (size)</label>
      <select id="size">
        <option value="5x7">5x7</option>
        <option value="A4">A4</option>
      </select>

      <label>Idadi ya picha anazonunua</label>
      <input type="number" id="taken" placeholder="Mfano: 5" min="0" />

      <label>Service: </label>
      <input type="number" id="kawaida" placeholder=" Kawaida" min="0" />
      <input type="number" id="editing" placeholder="Editing" min="0" />

      <label>Kiasi alicholipa</label>
      <input type="number" id="paid" placeholder="Kiasi alicholipia " min="0" />

      <button id="addBtn">Save Customer!</button>
    </div>

    <!-- EVENTS LIST -->
    <div id="eventsList"></div>

    <!-- HAMISHA WATEJA WA ZAMANI (futa baada ya kutumia) -->
    <div class="card" id="migrateCard" style="display:none">
      <h3>Wateja wasio na event</h3>
      <p id="migrateInfo"></p>
      <label>Wahamishie kwenye event</label>
      <select id="migrateSelect"></select>
      <button id="migrateBtn">Hamisha Wateja Wote</button>
    </div>

    <!-- FILTER YA EVENT -->
    <label>View wateja wa event</label>
    <select id="eventFilter">
      <option value="all">Events zote</option>
    </select>

    <input type="text" id="search" class="search" placeholder="🔍 Search kwa Jina..." />

    <div class="filters">
      <button id="fAll" class="filter active">ALL</button>
      <button id="fDebt" class="filter">Wenye Deni</button>
    </div>

    <div id="summary" class="summary"></div>

    <div id="list"></div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="script.js"></script>
</body>
</html>
